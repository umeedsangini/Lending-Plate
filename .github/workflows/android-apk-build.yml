
name: Build Lending Plate APK

on:
  workflow_dispatch:
  push:
    paths:
      - "LendingPlate_Android_Studio_Project.zip"
      - ".github/workflows/android-apk-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          unzip -q LendingPlate_Android_Studio_Project.zip
          cd LendingPlate_Android_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lending-Plate-debug-APK
          path: LendingPlate_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
